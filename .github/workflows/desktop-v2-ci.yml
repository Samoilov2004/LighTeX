name: LighTex 1.1 Cross-platform CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-v2-bindings.sh"
      - ".github/workflows/desktop-v2-ci.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macOS-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            name: macOS-x86_64
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            name: Linux-x86_64
            target: x86_64-unknown-linux-gnu
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - run: pnpm install --frozen-lockfile
      - name: Test Rust core and desktop commands
        run: cargo test --workspace --target "${{ matrix.target }}"
      - name: Verify generated Rust/TypeScript contracts
        run: git diff --exit-code -- crates/lightex-core/bindings
      - name: Test React UI
        run: pnpm --dir apps/desktop test
      - name: Build Safari 13 frontend
        run: pnpm --dir apps/desktop build:web
      - name: Build native executable
        run: pnpm --dir apps/desktop tauri build --target "${{ matrix.target }}" --no-bundle
