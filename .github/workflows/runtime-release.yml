name: Release LighTeX Runtime

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime version written into the signed manifest
        required: true
        default: "2026.1"
      texlive_year:
        description: TeX Live release year
        required: true
        default: "2026"

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    env:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      RUNTIME_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Verify release credentials are configured
        shell: bash
        run: |
          missing=()
          [[ -n "$DEVELOPER_ID_P12_BASE64" ]] || missing+=(DEVELOPER_ID_P12_BASE64)
          [[ -n "$DEVELOPER_ID_P12_PASSWORD" ]] || missing+=(DEVELOPER_ID_P12_PASSWORD)
          [[ -n "$DEVELOPER_ID_APPLICATION" ]] || missing+=(DEVELOPER_ID_APPLICATION)
          [[ -n "$NOTARY_APPLE_ID" ]] || missing+=(NOTARY_APPLE_ID)
          [[ -n "$NOTARY_TEAM_ID" ]] || missing+=(NOTARY_TEAM_ID)
          [[ -n "$NOTARY_PASSWORD" ]] || missing+=(NOTARY_PASSWORD)
          [[ -n "$RUNTIME_SIGNING_PRIVATE_KEY_BASE64" ]] || missing+=(RUNTIME_SIGNING_PRIVATE_KEY_BASE64)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Secret: %s\n' "${missing[@]}"
            exit 1
          fi

  build-runtime:
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, standard, full]
        platform:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.platform.architecture }}"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/lightex-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"

      - name: Build portable runtime
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          ./scripts/build-runtime.sh \
            "${{ matrix.variant }}" \
            "${{ matrix.platform.architecture }}" \
            "${{ inputs.runtime_version }}" \
            "$RUNNER_TEMP/runtime-output"

      - name: Notarize runtime archive
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ARCHIVE=$(find "$RUNNER_TEMP/runtime-output" -name '*.zip' -maxdepth 1)
          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.variant }}-${{ matrix.platform.architecture }}
          path: ${{ runner.temp }}/runtime-output/*
          compression-level: 0

  publish-runtime:
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: runtime-assets
          merge-multiple: true

      - name: Generate signed manifest
        env:
          SIGNING_KEY_BASE64: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          python3 scripts/generate-runtime-manifest.py \
            --metadata-directory runtime-assets \
            --runtime-version "${{ inputs.runtime_version }}" \
            --texlive-year "${{ inputs.texlive_year }}" \
            --release-base-url "https://github.com/${{ github.repository }}/releases/download/runtime-latest" \
            --output runtime-assets/runtime-manifest.json
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/runtime-signing-key.pem"
          openssl pkeyutl -sign -rawin \
            -inkey "$RUNNER_TEMP/runtime-signing-key.pem" \
            -in runtime-assets/runtime-manifest.json \
            -out runtime-assets/runtime-manifest.sig

      - name: Publish stable runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view runtime-latest >/dev/null 2>&1 || \
            gh release create runtime-latest --title "LighTeX Runtime" --notes "Managed TeX Live runtime assets."
          gh release upload runtime-latest \
            runtime-assets/*.zip \
            runtime-assets/runtime-manifest.json \
            runtime-assets/runtime-manifest.sig \
            --clobber
