name: Build LighTex 1.1 Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: "1.1.0"
      publish:
        description: Publish a GitHub Release after all packages pass
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macOS-Apple-Silicon
            target: aarch64-apple-darwin
            bundles: app
          - runner: macos-15-intel
            name: macOS-Intel
            target: x86_64-apple-darwin
            bundles: app
          - runner: ubuntu-22.04
            name: Linux-amd64
            target: x86_64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - run: pnpm install --frozen-lockfile
      - name: Set package version
        shell: bash
        run: |
          node -e 'const fs=require("fs"); for (const p of ["apps/desktop/package.json","apps/desktop/src-tauri/tauri.conf.json"]) { const j=JSON.parse(fs.readFileSync(p)); j.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n"); }' "${{ inputs.version }}"
          sed -i.bak -E 's/^version = "[^"]+"/version = "${{ inputs.version }}"/' Cargo.toml
          rm -f Cargo.toml.bak
      - run: cargo test --workspace --target "${{ matrix.target }}"
      - run: pnpm --dir apps/desktop test
      - name: Build package
        run: pnpm --dir apps/desktop tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Prepare polished DMG tooling
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            -r scripts/release-requirements.txt
      - name: Collect package
        shell: bash
        env:
          DMGBUILD_EXECUTABLE: ${{ runner.temp }}/dmgbuild-venv/bin/dmgbuild
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ./scripts/create-dmg.sh \
              "target/${{ matrix.target }}/release/bundle/macos/LighTex.app" \
              "$RUNNER_TEMP/packages/LighTex-${{ inputs.version }}-${{ matrix.name }}.dmg" \
              LighTex
          else
            cp target/${{ matrix.target }}/release/bundle/deb/*.deb "$RUNNER_TEMP/packages/LighTex-${{ inputs.version }}-${{ matrix.name }}.deb"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LighTex-${{ matrix.name }}
          path: ${{ runner.temp }}/packages/*
          compression-level: 0

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LighTex-*
          path: packages
          merge-multiple: true
      - name: Publish explicit 1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" packages/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "LighTex ${{ inputs.version }}" \
            --notes "Cross-platform LighTex packages for Intel Mac, Apple Silicon, and Debian/Ubuntu."
