name: Release LighTeX App

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable GitHub release version
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - architecture: arm64
            runner: macos-15
            asset_name: macOS-Apple-Silicon
          - architecture: x86_64
            runner: macos-15-intel
            asset_name: macOS-Intel
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.platform.architecture }}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Set release version
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${{ inputs.version }}" \
            Resources/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ github.run_number }}" \
            Resources/Info.plist

      - name: Run tests
        env:
          LIGHTEX_REQUIRE_TEST_EXECUTION: "1"
        run: ./scripts/test.sh

      - name: Build ad-hoc signed app
        run: ./scripts/build-app.sh

      - name: Verify app bundle
        run: |
          test -x dist/LighTex.app/Contents/MacOS/LighTex
          lipo -archs dist/LighTex.app/Contents/MacOS/LighTex | \
            grep -qw "${{ matrix.platform.architecture }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/LighTex.app/Contents/Info.plist)" = \
            "${{ inputs.version }}"
          plutil -lint dist/LighTex.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/LighTex.app

      - name: Prepare DMG tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            -r scripts/release-requirements.txt

      - name: Package app
        env:
          DMGBUILD_EXECUTABLE: ${{ runner.temp }}/dmgbuild-venv/bin/dmgbuild
        run: |
          ZIP="$RUNNER_TEMP/LighTex-${{ matrix.platform.asset_name }}.zip"
          DMG="$RUNNER_TEMP/LighTex-${{ matrix.platform.asset_name }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/LighTex.app "$ZIP"
          ./scripts/create-dmg.sh dist/LighTex.app "$DMG" LighTex

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform.architecture }}
          path: |
            ${{ runner.temp }}/LighTex-${{ matrix.platform.asset_name }}.zip
            ${{ runner.temp }}/LighTex-${{ matrix.platform.asset_name }}.dmg
          compression-level: 0

  publish-app:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: app-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v${{ inputs.version }}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "LighTex ${{ inputs.version }}" \
              --latest \
              --notes "The first stable LighTex release for Apple Silicon and Intel Macs. Includes safe document handling, project search, reusable templates, improved completion and SyncTeX, PDF search, runtime management, and the compact Insert Shelf. The app is distributed directly through GitHub and is not yet notarized by Apple; if macOS blocks the first launch, Control-click LighTex and choose Open."
          gh release upload "v${{ inputs.version }}" \
            app-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
