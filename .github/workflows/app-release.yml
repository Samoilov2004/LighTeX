name: Release LighTeX App

on:
  workflow_dispatch:
    inputs:
      version:
        description: GitHub release version
        required: true
        default: "0.6.0-beta.1"

permissions:
  contents: write

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.platform.architecture }}"

      - name: Build ad-hoc signed preview app
        run: ./scripts/build-app.sh

      - name: Prepare DMG tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            -r scripts/release-requirements.txt

      - name: Package preview app
        env:
          DMGBUILD_EXECUTABLE: ${{ runner.temp }}/dmgbuild-venv/bin/dmgbuild
        run: |
          ZIP="$RUNNER_TEMP/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.zip"
          DMG="$RUNNER_TEMP/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/LighTex.app "$ZIP"
          ./scripts/create-dmg.sh dist/LighTex.app "$DMG" LighTex

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform.architecture }}
          path: |
            ${{ runner.temp }}/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.zip
            ${{ runner.temp }}/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.dmg
          compression-level: 0

  publish-app:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: app-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v${{ inputs.version }}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "LighTex ${{ inputs.version }} Beta" \
              --prerelease \
              --notes "Beta release with the latest editor and project workflow improvements. This build is not yet notarized by Apple; if macOS blocks the first launch, Control-click LighTex and choose Open."
          gh release upload "v${{ inputs.version }}" \
            app-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
