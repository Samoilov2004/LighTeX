name: Release LighTeX App

on:
  workflow_dispatch:
    inputs:
      version:
        description: GitHub release version
        required: true
        default: "0.5.1"

permissions:
  contents: write

jobs:
  build-app:
    strategy:
      matrix:
        platform:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.platform.architecture }}"

      - name: Build ad-hoc signed preview app
        run: ./scripts/build-app.sh

      - name: Package preview app
        run: |
          ZIP="$RUNNER_TEMP/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.zip"
          DMG="$RUNNER_TEMP/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/LighTex.app "$ZIP"
          DMG_ROOT="$RUNNER_TEMP/LighTex DMG"
          mkdir -p "$DMG_ROOT"
          ditto dist/LighTex.app "$DMG_ROOT/LighTex.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname LighTex -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform.architecture }}
          path: |
            ${{ runner.temp }}/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.zip
            ${{ runner.temp }}/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.dmg
          compression-level: 0

  publish-app:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: app-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ inputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "v${{ inputs.version }}" \
              --repo "${{ github.repository }}" \
              --title "LighTex ${{ inputs.version }} Preview" \
              --notes "First public preview. This build is not yet notarized by Apple; if macOS blocks the first launch, Control-click LighTex and choose Open."
          gh release upload "v${{ inputs.version }}" \
            app-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
