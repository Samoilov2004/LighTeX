name: Release LighTeX App

on:
  workflow_dispatch:
    inputs:
      version:
        description: GitHub release version
        required: true
        default: "0.5.1"

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    env:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      RUNTIME_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.RUNTIME_SIGNING_PUBLIC_KEY_BASE64 }}
    steps:
      - name: Verify release credentials are configured
        shell: bash
        run: |
          missing=()
          [[ -n "$DEVELOPER_ID_P12_BASE64" ]] || missing+=(DEVELOPER_ID_P12_BASE64)
          [[ -n "$DEVELOPER_ID_P12_PASSWORD" ]] || missing+=(DEVELOPER_ID_P12_PASSWORD)
          [[ -n "$DEVELOPER_ID_APPLICATION" ]] || missing+=(DEVELOPER_ID_APPLICATION)
          [[ -n "$NOTARY_APPLE_ID" ]] || missing+=(NOTARY_APPLE_ID)
          [[ -n "$NOTARY_TEAM_ID" ]] || missing+=(NOTARY_TEAM_ID)
          [[ -n "$NOTARY_PASSWORD" ]] || missing+=(NOTARY_PASSWORD)
          [[ -n "$RUNTIME_SIGNING_PUBLIC_KEY_BASE64" ]] || missing+=(RUNTIME_SIGNING_PUBLIC_KEY_BASE64)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Secret: %s\n' "${missing[@]}"
            exit 1
          fi

  build-app:
    needs: release-preflight
    strategy:
      matrix:
        platform:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.platform.architecture }}"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/lightex-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"

      - name: Build signed app
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          RUNTIME_PUBLIC_KEY_BASE64: ${{ secrets.RUNTIME_SIGNING_PUBLIC_KEY_BASE64 }}
        run: ./scripts/build-app.sh

      - name: Package and notarize
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ZIP="$RUNNER_TEMP/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.zip"
          DMG="$RUNNER_TEMP/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/LighTex.app "$ZIP"
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple dist/LighTex.app
          rm "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent dist/LighTex.app "$ZIP"
          hdiutil create -volname LighTex -srcfolder dist/LighTex.app -ov -format UDZO "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform.architecture }}
          path: |
            ${{ runner.temp }}/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.zip
            ${{ runner.temp }}/LighTex-${{ inputs.version }}-${{ matrix.platform.architecture }}.dmg
          compression-level: 0

  publish-app:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: app-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            app-assets/* \
            --repo "${{ github.repository }}" \
            --title "LighTex ${{ inputs.version }}" \
            --generate-notes
